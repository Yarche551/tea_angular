<div class="card h-100 shadow-sm">
  <img src="{{product.image}}" alt="first">
  <h3 class="card-title">{{product.title}}</h3>
  <div class="card-body d-flex flex-column justify-content-between">
    <p class="card-text">{{product.description | textFormat}}</p>
    <div class="d-flex justify-content-between align-items-center">
      <div class="btn-group">
        <a class="btn btn-primary product__btn btn-add-to-cart to-more" [routerLink]="['/product-page', product.id]">Подробнее</a>
      </div>
    </div>
  </div>
</div>
